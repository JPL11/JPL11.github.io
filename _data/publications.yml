- title: "Does Certified Semantic Communication Survive Model Compression?"
  venue: "ICNC 2027 (International Conference on Computing, Networking and Communications)"
  status: "Accepted"
  year: 2027
  description: "Certified semantic communication adapts its transmission rate under a distribution-free conformal guarantee — but that guarantee only covers the model that was calibrated. This paper measures what happens when the model is compressed afterwards. INT8 and INT4 heads stay within the risk allowance, while binary quantization, 2-bit students and quantized rankings miscover at 0.31–0.62. Binary students distilled at temperature 1 are the dangerous case: they match full-precision accuracy and pass a rank-correlation check while miscovering at 0.26, though a distribution-based witness catches them. Recalibration restores every variant to nominal coverage."
  tech: ["Semantic Communication", "Conformal Prediction", "Quantization", "Event Cameras"]
  links: {}

- title: "A Label-Efficient On-Device QC Agent for MRI Segmentation under Domain Shift"
  venue: "MedAgent: 2nd Workshop on Agentic AI for Medicine (MICCAI 2026)"
  status: "Accepted"
  year: 2026
  description: "Under domain shift a segmenter can miss a tumor confidently, so QC built on uncertainty inherits a blind spot. This agent instead learns a failure detector over a compact 29-dimensional signature of the segmenter's output, flags likely failures for clinician review, and recalibrates online from the cases that come back reviewed — without ever touching the segmenter's weights. On held-out BraTS-Africa it reaches AUROC 0.91, and reviewing the top-ranked 20% of slices surfaces 48% of all major failures; the numpy-only runtime scores a slice in 88 µs on a 15 W Jetson Orin Nano with model state under 200 KB."
  tech: ["Medical Imaging", "Edge AI", "Runtime QC", "Domain Shift"]
  links:
    paper: "https://papers.miccai.org/miccai-2026-sat/MedAgent_023.html"
    github: "https://github.com/JPL11/memory_qc_edge"
