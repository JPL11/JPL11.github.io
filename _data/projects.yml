- name: "MemoryQC-Edge: Label-Efficient On-Device QC Agent for MRI Segmentation"
  description: "Under domain shift a segmenter can miss a tumor confidently, so QC built on uncertainty inherits a blind spot. This agent learns a failure detector over a compact 29-dimensional signature of the segmenter's output, flags likely failures for clinician review, and recalibrates online from the cases that come back reviewed, without touching the segmenter's weights. Accepted at the MedAgent workshop (MICCAI 2026)."
  role: "Research (first author) · MICCAI 2026 MedAgent workshop, accepted"
  highlights:
    - "AUROC 0.91 on held-out BraTS-Africa; reviewing the top-ranked 20% of slices surfaces 48% of all major failures."
    - "numpy-only runtime scores a slice in 88 µs on a 15 W Jetson Orin Nano with model state under 200 KB."
  tech: ["Medical Imaging", "Edge AI", "Runtime QC", "Domain Shift"]
  links:
    github: "https://github.com/JPL11/memory_qc_edge"

- name: "EvCorrupt-Bench: Runtime Corruption Detection for Event Cameras"
  description: "A benchmark and monitor study for detecting sensor corruption in event-camera streams at runtime: six physically modeled failure modes (leak-event hot pixels, mains flicker, activity bursts, dead regions, readout congestion, polarity faults) injected as timed episodes into 42 recordings across four sensor families, with leakage-safe injection and false-alarm-budgeted evaluation. Under revision for resubmission."
  role: "Research (first author)"
  highlights:
    - "Grew out of a self-supervised SNN-GNN event denoiser (97% reconstruction accuracy), which now serves as label source and fallback action."
    - "Injection pipeline released as the open-source `evlab` package (pip install evlab): reproducible recipes, per-event ground truth, clock-quantum snapping."
  tech: ["PyTorch", "Event Cameras", "SNN", "Benchmarking"]
  links:
    github: "https://github.com/JPL11/evlab"

- name: "SpikeGuard-RC: Spiking Reservoir Safety Monitoring (in progress)"
  description: "An always-on spiking reservoir that maintains a compact temporal memory over windowed event-stream features and predicts safe / unsafe / uncertain, gating downstream perception: continue, abstain, or fall back to denoising. Targeting a computer-vision venue submission."
  role: "Research"
  highlights:
    - "Corruption-injected freeway benchmark with exact onsets for AUROC and time-to-detection; UAV streams as real-world transfer test."
    - "Compared against rule-based, MLP, GRU, LSTM, and non-spiking ESN baselines on detection quality, RAM, latency, and spike-rate energy proxy."
  tech: ["SNN", "Reservoir Computing", "Event Cameras", "Edge AI"]
  links: {}

- name: "FedCW: What Compression Does an Edge Federation Actually Need?"
  description: "A measured federated-learning study on real hardware instead of simulation: a desktop, Raspberry Pi 5, Raspberry Pi 4, and Jetson Orin Nano train a shared autoencoder over live Wi-Fi with per-exchange wall-time and byte accounting, on a cosmic-ray sensor-network (CosmicWatch / CREDO) workload. Manuscript prepared for ICAIIC 2027."
  role: "Research (first author) · ICAIIC 2027 submission"
  highlights:
    - "Straggler economics: staleness-weighted asynchronous aggregation reaches 2.4× lower loss at equal wall clock on the most heterogeneous fleet, at a 5.5× higher steady-state wire rate."
    - "Compression ladder with a recovered floor: naive int8 is the only wire format that degrades beyond run-to-run variation; error-feedback wires (quantized delta, top-k) match fp32 at 73–81% fewer bytes."
    - "Links decide participation: under emulated LTE / LTE-M / NB-IoT, the compressed wire admits 1.6–3× more updates, and a server-side fp32 → fp16 → delta-int8 policy adapts per connection with no client-side logic."
  tech: ["PyTorch", "Federated Learning", "Edge AI", "Update Compression", "Raspberry Pi / Jetson"]
  links:
    github: "https://github.com/JPL11/CosmicWatch"

- name: "Content-Adaptive Neuromorphic Semantic Communication"
  description: "SpikeAdapt-SC, an SNN-based semantic communication framework for aerial edge AI."
  role: "Research"
  highlights:
    - "32–48% estimated computation energy savings via SynOps over MAC-based encoding."
    - "Reduced payload from 64 KB to 48 KB per image (25% bandwidth savings) with zero accuracy penalty at ρ = 0.75."
    - "Achieved 96.2% adaptive BSC accuracy vs. 95.8% fixed full-rate; >93% accuracy under severe conditions (BER = 0.3, SNR = −2 dB)."
  tech: ["PyTorch", "SNN", "Edge AI", "Semantic Communication"]
  links: {}

- name: "PokeAgent Speedrun"
  description: "Open-source Pokémon Emerald speedrunning agent with 4 agent scaffolds (four-module, simple, ReAct, ClaudePlays) and a multiprocess emulator/agent architecture for stable long-horizon execution."
  role: "Open Source / Agent Systems"
  highlights:
    - "Documented lightweight simple pipeline runs 3–5× faster and retains the last 20 actions for compact action history."
    - "Production-oriented execution paths including no-ocr mode and automated gameplay recording at 30 FPS."
  tech: ["Python", "Agents", "LLMs"]
  links: {}

